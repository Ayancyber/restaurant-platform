name: Supabase Showcase Keep Alive

on:
  schedule:
    # Daily at 11:17 AM Pakistan time (UTC+5)
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Check showcase Supabase database
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SHOWCASE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing SHOWCASE_SUPABASE_ANON_KEY secret."
            exit 1
          fi

          STATUS=$(curl --silent --show-error \
            --output /dev/null \
            --write-out "%{http_code}" \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "https://gewypifmpqkrgdkzjkgy.supabase.co/rest/v1/menu_items?select=id&limit=1")

          if [ "$STATUS" = "200" ]; then
            echo "Showcase Supabase keep-alive successful."
          else
            echo "Supabase request failed with HTTP status: $STATUS"
            exit 1
          fi
